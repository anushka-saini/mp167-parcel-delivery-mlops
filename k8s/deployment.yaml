apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp167-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp167-api
  template:
    metadata:
      labels:
        app: mp167-api
    spec:
      containers:
        - name: mp167-api
          image: mp167-api:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
